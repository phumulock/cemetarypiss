<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CEMETARY PISS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #000;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    font-family: 'Courier New', ui-monospace, monospace;
    color: #f0e8e0;
  }
  canvas { display: block; position: absolute; top: 0; left: 0; }

  .navbar, .footer {
    position: fixed;
    left: 0;
    right: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    padding: 0 18px;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #c8b8a8;
    pointer-events: none;
    user-select: none;
  }
  .navbar {
    top: 0;
    height: 48px;
    justify-content: space-between;
    border-bottom: 1px solid rgba(120, 30, 30, 0.3);
  }
  .footer {
    bottom: 0;
    height: 40px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    border-top: 1px solid rgba(120, 30, 30, 0.3);
    font-size: 10px;
    color: #886655;
  }
  .footer > :last-child { text-align: right; }
  .navbar .brand { font-style: italic; letter-spacing: 0.12em; color: #d8c8b8; }
  .navbar .links { display: flex; gap: 18px; }

  /* tablet / medium */
  @media (max-width: 1000px) {
    .navbar { height: 44px; padding: 0 14px; font-size: 10px; }
    .navbar .links { gap: 14px; }
    .footer { height: 36px; padding: 0 14px; font-size: 9px; }
  }

  /* phone / small */
  @media (max-width: 600px) {
    .navbar {
      height: 40px;
      padding: 0 12px;
      font-size: 9px;
      letter-spacing: 0.18em;
    }
    .navbar .links { gap: 10px; }
    .footer {
      height: 32px;
      padding: 0 12px;
      font-size: 8px;
      letter-spacing: 0.18em;
    }
  }

  .audio-controls {
    display: flex;
    align-items: center;
    gap: 4px;
    pointer-events: auto;
  }
  .audio-toggle {
    background: transparent;
    border: 1px solid #3a0000;
    color: #7a0000;
    padding: 4px 12px;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    pointer-events: auto;
    transition: background 0.2s, color 0.2s;
  }
  .audio-toggle:hover { background: #1a0000; color: #c00; }
  .audio-toggle.on { color: #c00; border-color: #5a0000; }
  .audio-nav {
    background: transparent;
    border: 1px solid #3a0000;
    color: #7a0000;
    padding: 4px 8px;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    cursor: pointer;
    pointer-events: auto;
    transition: background 0.2s, color 0.2s;
    line-height: 1;
  }
  .audio-nav:hover { background: #1a0000; color: #c00; }
</style>
</head>
<body>
<div class="navbar">
  <div class="brand">// cemetary piss</div>
  <div class="links"><span>shows</span><span>merch</span><span>contact</span></div>
</div>
<canvas id="c"></canvas>
<div class="footer">
  <div>est. mmxxvi</div>
  <div class="audio-controls">
    <button class="audio-nav" id="prev-btn" aria-label="Previous track">«</button>
    <button class="audio-toggle" id="audio-toggle" aria-label="Toggle audio">♪ off</button>
    <button class="audio-nav" id="next-btn" aria-label="Next track">»</button>
  </div>
  <div>baltimore, md</div>
</div>
<!-- ============================================================
     AUDIO: replace the src below with your audio file.
     Drop your file alongside this HTML and update the filename.
     ============================================================ -->
<audio id="bg-audio" loop preload="auto">
  <source src="01 - Intro.mp3" type="audio/mpeg" />
</audio>
<audio id="bg-audio-2" loop preload="auto">
  <source src="02 - Spermanaut.mp3" type="audio/mpeg" />
</audio>

      const R = boxCornerR;
      if (r < boxTop + R && c < boxLeft + R) {
        const dr = (boxTop + R) - r, dc = (boxLeft + R) - c;
        if (dr * dr + dc * dc > R * R) return true;
      }
      if (r < boxTop + R && c > boxRight - R) {
        const dr = (boxTop + R) - r, dc = c - (boxRight - R);
        if (dr * dr + dc * dc > R * R) return true;
      }
      if (r > boxBottom - R && c < boxLeft + R) {
        const dr = r - (boxBottom - R), dc = (boxLeft + R) - c;
        if (dr * dr + dc * dc > R * R) return true;
      }
      if (r > boxBottom - R && c > boxRight - R) {
        const dr = r - (boxBottom - R), dc = c - (boxRight - R);
        if (dr * dr + dc * dc > R * R) return true;
      }
      return false;
    }

    cells = [];
    for (let r = 0; r < totalRows; r++) {
      for (let c = 0; c < totalCols; c++) {
        const lr = r - logoRowOffset;
        const lc = c - logoColOffset;
        let ch;
        let isSpace = false;
        let isCrossTexture = false;

        const inLogoBox = (lr >= 0 && lr < LOGO_ROWS && lc >= 0 && lc < LOGO_COLS);

        let isOuterFiller = false;

        // If the cell is inside the logo block's rectangle but in a corner
        // zone outside the rounded arc, treat it as outside @ filler instead
        // of using the logo's character. This rounds the block's corners.
        if (inLogoBox && inBlockCornerCut(r, c)) {
          ch = fillerChar(r * 73 + c * 31);
          isOuterFiller = true;
          cells.push({ col: c, row: r, ch, isSpace: false, isCrossTexture: false, isOuterFiller, seed: r * 73 + c * 31 });
          continue;
        }

        let isDeepFill = false;
        if (inLogoBox) {
          ch = LOGO[lr][lc] || ' ';
          isSpace = (ch === ' ');
          if (ch === '@') {
            let deep = true;
            outer: for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) continue;
                const nlr = lr + dr, nlc = lc + dc;
                if (nlr < 0 || nlr >= LOGO_ROWS || nlc < 0 || nlc >= LOGO_COLS || (LOGO[nlr][nlc] || ' ') !== '@') {
                  deep = false; break outer;
                }
              }
            }
            isDeepFill = deep;
          }
        } else {
          const key = r * 10000 + c;
          const cv = carved.get(key);
          if (cv) {
            ch = textureChar(cv.tier, cv.seed);
            if (ch === ' ') { isSpace = true; }
            else { isCrossTexture = true; }
          } else {
            ch = fillerChar(r * 73 + c * 31);
            isOuterFiller = true;
          }
        }
        cells.push({ col: c, row: r, ch, isSpace, isCrossTexture, isOuterFiller, isDeepFill, seed: r * 73 + c * 31 });
      }
    }
  }

  const FALL_DURATION = 260;
  const SWEEP_DURATION = 2200;

  let animCells = [];
  function assignTiming() {
    const sorted = [...cells].map((cell, i) => ({
      ...cell,
      idx: i,
      angle: Math.random() * Math.PI * 2,
      sortKey: -cell.row * 1.5 + cell.col * 0.05 + Math.random() * 8
    })).sort((a, b) => a.sortKey - b.sortKey);
    const n = sorted.length;
    sorted.forEach((c, i) => {
      c.startAt = (i / n) * SWEEP_DURATION + Math.random() * 40;
    });
    return sorted;
  }

  let animStart = 0;
  let finished = false;
  let hasAnimated = false;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function startInstant() {
    resize();
    buildGrid();
    animCells = assignTiming();
    // Place animStart far enough in the past that every cell is fully settled
    animStart = performance.now() - (SWEEP_DURATION + FALL_DURATION + 600);
    finished = true;
    requestAnimationFrame(loop);
  }

  function start() {
    if (hasAnimated) { startInstant(); return; }
    hasAnimated = true;
    resize();
    buildGrid();
    animCells = assignTiming();
    animStart = performance.now();
    finished = false;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
    requestAnimationFrame(loop);
  }

  function loop(now) {
    const elapsed = now - animStart;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    ctx.font = `${Math.floor(cellH)}px 'Courier New', ui-monospace, monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    let allLanded = true;

    for (const cell of animCells) {
      if (cell.isSpace) continue;
      if (cell.isOuterFiller || cell.isCrossTexture) continue;

      const targetX = cell.col * cellW + cellW / 2;
      const targetY = NAVBAR_PX + gridYOffset + cell.row * cellH + cellH / 2;

      const t = elapsed - cell.startAt;
      if (t < 0) { allLanded = false; continue; }

      const fallT = Math.min(1, t / FALL_DURATION);
      if (fallT < 1) allLanded = false;

      const flyDist = Math.max(window.innerWidth, window.innerHeight) * 1.2;
      const startX = targetX + Math.cos(cell.angle) * flyDist;
      const startY = targetY + Math.sin(cell.angle) * flyDist;
      const p = easeOutCubic(fallT);
      const x = startX + (targetX - startX) * p;
      const y = startY + (targetY - startY) * p;

      if (fallT < 1 && fallT > 0.05) {
        const streakLen = 3;
        for (let s = 1; s <= streakLen; s++) {
          const sx = x + Math.cos(cell.angle) * s * cellH * 0.7;
          const sy = y + Math.sin(cell.angle) * s * cellH * 0.7;
          const alpha = (1 - s / streakLen) * 0.4 * (1 - fallT);
          ctx.fillStyle = `rgba(200, 30, 30, ${alpha})`;
          ctx.fillText(cell.ch, sx, sy);
        }
      }

      if (fallT < 1) {
        ctx.fillStyle = `rgba(255, 180, 180, 0.95)`;
        ctx.fillText(cell.ch, x, y);
      } else {
        const age = t - FALL_DURATION;
        const glow = Math.min(1, age / 500);
        if (glow < 1) {
          ctx.fillStyle = `rgba(220, 40, 40, ${(1 - glow) * 0.6})`;
          ctx.fillText(cell.ch, targetX, targetY);
        }
        // SHUTTER: for outer filler cells, occasionally swap to a different
        // filler char. Each cell has its own phase + frequency so they don't
        // all flicker in sync.
        let drawChar = cell.ch;
        if (cell.isDeepFill && glow >= 1) {
          const phase = (cell.seed * 0.137) % (Math.PI * 2);
          const rate = 0.0008 + (Math.sin(cell.seed * 0.91) + 1) * 0.0006;
          const noise = Math.sin(now * rate + phase) + Math.sin(now * rate * 1.7 + phase * 2);
          if (noise > 1.85) {
            const altSeed = cell.seed + Math.floor(now / 120);
            drawChar = fillerChar(altSeed);
          }
        }
        let fillColor;
        if (glow >= 1 && cell.isDeepFill) {
          // Randomly flutter yellow — only deep fill cells (not touching letter edges)
          const canBeYellow = (cell.seed * 7919 + cell.col * 3313) % 100 < 30;
          if (canBeYellow) {
            const yPhase = (cell.seed * 0.317) % (Math.PI * 2);
            const yRate  = 0.0002 + (Math.sin(cell.seed * 1.23) + 1) * 0.00045;
            const yNoise = Math.sin(now * yRate + yPhase) + Math.sin(now * yRate * 2.1 + yPhase * 1.6);
            if (yNoise > 1.5) {
              const yAlpha = Math.min(1, (yNoise - 1.5) / 0.5) * 0.9;
              fillColor = `rgba(255, 220, 0, ${yAlpha})`;
            }
          }
        }
        if (!fillColor) {
          const baseAlpha = cell.isCrossTexture ? 0.5 : 0.95;
          fillColor = `rgba(245, 240, 235, ${(0.3 + 0.5 * glow) * baseAlpha + 0.2 * glow})`;
        }
        ctx.fillStyle = fillColor;
        ctx.fillText(drawChar, targetX, targetY);
      }
    }

    if (allLanded && !finished) {
      finished = true;
    }

    requestAnimationFrame(loop);
  }

  // Resize handling: debounce, then check if tier changed.
  // If tier changed -> full replay. Otherwise just rebuild grid without replay.
  let resizeTimer;
  let lastWidth = window.innerWidth;
  let lastHeight = window.innerHeight;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const newTier = pickTier();
      const sizeChangedSignificantly =
        Math.abs(window.innerWidth - lastWidth) > 50 ||
        Math.abs(window.innerHeight - lastHeight) > 50;

      if (newTier !== activeTier || sizeChangedSignificantly) {
        lastWidth = window.innerWidth;
        lastHeight = window.innerHeight;
        startInstant();
      } else {
        resize();
      }
    }, 200);
  });
  // Also handle orientation changes explicitly (mobile)
  window.addEventListener('orientationchange', () => {
    setTimeout(startInstant, 300);
  });

  // ============================================================
  // AUDIO controls
  // ============================================================
  const tracks = [
    document.getElementById('bg-audio'),
    document.getElementById('bg-audio-2'),
  ];
  const trackNames = ['intro', 'spermanaut'];
  const audioToggle = document.getElementById('audio-toggle');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');

  const MAX_VOL  = 0.15;
  const CYCLE_MS = 30000;
  const FADE_MS  = 5000;

  let playing    = false;
  let currentIdx = 0;
  let cycleTimer = null;
  let fadeTimer  = null;

  function fade(el, from, to, ms, cb) {
    clearInterval(fadeTimer);
    const TICK  = 30;
    const steps = Math.round(ms / TICK);
    const delta = (to - from) / steps;
    let n = 0;
    fadeTimer = setInterval(() => {
      n++;
      el.volume = Math.min(1, Math.max(0, from + delta * n));
      if (n >= steps) {
        el.volume = to;
        clearInterval(fadeTimer);
        if (cb) cb();
      }
    }, TICK);
  }

  function runCycle(idx) {
    currentIdx = idx;
    audioToggle.textContent = '♪ ' + trackNames[idx];
    const track = tracks[idx];
    track.volume = 0;
    track.play().catch(() => {});
    fade(track, 0, MAX_VOL, FADE_MS);
    cycleTimer = setTimeout(() => {
      fade(track, MAX_VOL, 0, FADE_MS, () => {
        track.pause();
        track.currentTime = 0;
        if (playing) runCycle((idx + 1) % tracks.length);
      });
    }, CYCLE_MS - FADE_MS);
  }

  function switchTrack(newIdx) {
    clearTimeout(cycleTimer);
    clearInterval(fadeTimer);
    const cur = tracks[currentIdx];
    cur.pause();
    cur.currentTime = 0;
    cur.volume = 0;
    if (!playing) {
      playing = true;
      audioToggle.classList.add('on');
    }
    runCycle(newIdx);
  }

  audioToggle.addEventListener('click', () => {
    playing = !playing;
    if (playing) {
      audioToggle.classList.add('on');
      runCycle(currentIdx);
    } else {
      audioToggle.textContent = '♪ off';
      audioToggle.classList.remove('on');
      clearTimeout(cycleTimer);
      fade(tracks[currentIdx], tracks[currentIdx].volume, 0, 1000, () => {
        tracks.forEach(t => { t.pause(); t.currentTime = 0; });
      });
    }
  });

  prevBtn.addEventListener('click', () => {
    switchTrack((currentIdx - 1 + tracks.length) % tracks.length);
  });

  nextBtn.addEventListener('click', () => {
    switchTrack((currentIdx + 1) % tracks.length);
  });

  start();
})();
</script>
</body>
</html>
